<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>{{TITLE}}</title>
<style>
  :root { --primary: {{PRIMARY}}; --accent: {{ACCENT}}; --font: {{FONT}}; --ink: #14161f; }
  #stage { font-family: var(--font); color: var(--ink);
    background: radial-gradient(120% 90% at 10% 0%, color-mix(in srgb, var(--primary) 22%, #fff), transparent 60%),
                radial-gradient(90% 80% at 100% 100%, color-mix(in srgb, var(--accent) 28%, #fff), transparent 60%), #f5f7fb; }
  .headline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -0.02em; }
  .window { position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 70px -30px rgba(20, 30, 80, .45), 0 0 0 1px rgba(20, 30, 80, .08); }
  .chrome { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px;
    background: #f1f3f8; border-bottom: 1px solid rgba(20, 30, 80, .06); }
  .chrome i { width: 9px; height: 9px; border-radius: 50%; background: rgba(20, 30, 80, .16); }
  .viewport { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="application/json" id="scene-data">
{
  "title": "{{TITLE}}",
  "captures": "{{CAPTURE}}",
  "frame": "browser",
  "cursor": {"name": "", "color": "{{PRIMARY}}"},
  "zoom": true,
  "captions": true,
  "loop": true,
  "hold": 650,
  "moveDuration": 850,
  "fit": "auto"
}
</script>
<script type="module">
  import {createScene, walkthrough, loadJson, fitBox} from '/__studio/runtime.js';

  const data = JSON.parse(document.getElementById('scene-data').textContent);
  const W = {{WIDTH}}, H = {{HEIGHT}};
  const scene = createScene({width: W, height: H});
  const plates = await loadJson(data.captures + 'plates.json');

  const portrait = H > W;
  const headlineHeight = data.title ? Math.round(H * (portrait ? 0.16 : 0.14)) : 0;
  const chromeHeight = data.frame === 'browser' ? Math.max(18, Math.round(H * 0.04)) : 0;
  const margin = Math.round(Math.min(W, H) * 0.06);
  const aspect = plates.viewport.width / plates.viewport.height;
  const area = {width: W - margin * 2, height: H - headlineHeight - margin * 2 - chromeHeight};
  const view = portrait ? {width: area.width, height: area.height} : fitBox(area, aspect);

  const win = scene.el('div', {className: 'window', style: {
    width: `${view.width}px`, height: `${view.height + chromeHeight}px`,
    left: `${(W - view.width) / 2}px`, top: `${headlineHeight + margin + (area.height - view.height) / 2}px`,
  }});
  if (chromeHeight) scene.el('div', {parent: win, className: 'chrome', html: '<i></i><i></i><i></i>', style: {height: `${chromeHeight}px`}});
  const viewport = scene.el('div', {parent: win, className: 'viewport', style: {top: `${chromeHeight}px`, height: `${view.height}px`}});

  if (data.title) {
    const headline = scene.el('div', {className: 'headline', text: data.title, style: {
      top: `${margin * 0.9}px`, padding: `0 ${margin}px`, fontSize: `${Math.round(Math.min(headlineHeight * 0.42, W * 0.065))}px`, lineHeight: 1.15,
    }});
    if (!data.loop) scene.fadeIn(headline, 0, 450, {y: 12});
  }
  if (!data.loop) scene.fadeIn(win, 100, 500, {y: 24});

  const flow = walkthrough(scene, plates, {
    base: data.captures,
    viewport,
    cursor: data.cursor,
    zoom: data.zoom,
    captions: data.captions,
    loop: data.loop,
    hold: data.hold,
    moveDuration: data.moveDuration,
    start: data.loop ? 0 : 500,
    fit: data.fit === 'auto' ? (view.width / view.height < aspect * 0.8 ? 'cover' : 'contain') : data.fit,
  });

  scene.done({duration: flow.end});
</script>
</body>
</html>
